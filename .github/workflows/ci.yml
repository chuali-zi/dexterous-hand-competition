name: Manual offline validation

# Manual only: no runner starts on push. Account minutes/cost must be checked
# before a user dispatches this workflow; this task did not dispatch it.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 snapshot
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 snapshot
        with:
          python-version: ${{ matrix.python-version }}
      - name: Tests, RGB replay, docs and data checks
        run: python scripts/check.py
